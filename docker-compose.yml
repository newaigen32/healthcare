# Azure credentials and SEARCH_PROVIDER are interpolated from the Compose
# project-root `.env` file (and the host environment). They are injected only
# into the backend service. The frontend never receives these values.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT:-}
      AZURE_SEARCH_INDEX_NAME: ${AZURE_SEARCH_INDEX_NAME:-}
      AZURE_SEARCH_API_KEY: ${AZURE_SEARCH_API_KEY:-}
      AZURE_SEARCH_TIMEOUT_SECONDS: ${AZURE_SEARCH_TIMEOUT_SECONDS:-15}
      AZURE_SEARCH_TOP: ${AZURE_SEARCH_TOP:-5}
      AZURE_SEARCH_ID_FIELD: ${AZURE_SEARCH_ID_FIELD:-id}
      AZURE_SEARCH_TITLE_FIELD: ${AZURE_SEARCH_TITLE_FIELD:-title}
      AZURE_SEARCH_CONTENT_FIELD: ${AZURE_SEARCH_CONTENT_FIELD:-content}
      AZURE_SEARCH_SOURCE_FIELD: ${AZURE_SEARCH_SOURCE_FIELD:-source}
      AZURE_SEARCH_CATEGORY_FIELD: ${AZURE_SEARCH_CATEGORY_FIELD:-category}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
