# Azure and database settings are interpolated from the Compose project-root
# `.env` file (and the host environment). They are injected only into the
# backend service. The frontend never receives these values.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./database/scripts/02_insert_sample_data.sql:/docker-entrypoint-initdb.d/02_insert_sample_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_user -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: INFO
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-postgres}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://healthcare_user:${POSTGRES_PASSWORD:-changeme_local_only}@db:5432/healthcare}
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT:-}
      AZURE_SEARCH_INDEX_NAME: ${AZURE_SEARCH_INDEX_NAME:-}
      AZURE_SEARCH_API_KEY: ${AZURE_SEARCH_API_KEY:-}
      AZURE_SEARCH_TIMEOUT_SECONDS: ${AZURE_SEARCH_TIMEOUT_SECONDS:-15}
      AZURE_SEARCH_TOP: ${AZURE_SEARCH_TOP:-5}
      AZURE_SEARCH_ID_FIELD: ${AZURE_SEARCH_ID_FIELD:-id}
      AZURE_SEARCH_TITLE_FIELD: ${AZURE_SEARCH_TITLE_FIELD:-title}
      AZURE_SEARCH_CONTENT_FIELD: ${AZURE_SEARCH_CONTENT_FIELD:-content}
      AZURE_SEARCH_SOURCE_FIELD: ${AZURE_SEARCH_SOURCE_FIELD:-source}
      AZURE_SEARCH_CATEGORY_FIELD: ${AZURE_SEARCH_CATEGORY_FIELD:-category}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
